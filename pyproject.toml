[project]
name = "surgical-md"
version = "0.1.0"
description = "Surgical, region-scoped edits to Markdown files."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "David Jones", email = "dljones555@gmail.com" }]
dependencies = []

[project.scripts]
surgical-md = "surgical_md.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["surgical_md"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
